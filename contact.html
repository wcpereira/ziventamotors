<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ziventamotors.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=202610031542">
  <title>Contact · Ziventa Motors Dubai</title>
  <meta name="description" content="Request a quotation from Ziventa Motors, JAFZA South, Dubai.">
</head>
<body data-page="contact">
  <main>
    <header class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.contact"></span></nav>
        <h1 class="serif h1" data-i18n="c.title"></h1>
        <p class="lead" data-i18n="c.lead"></p>
      </div>
    </header>
    <section style="padding-bottom:40px">
      <div class="container contact-grid">
        <div>
          <div class="card">
            <span class="kicker" data-i18n="c.direct"></span>
            <ul class="contact-list">
              <li><a id="c-wa" target="_blank" rel="noopener"><small data-i18n="c.whatsapp"></small><span class="ltr" id="c-wa-v"></span></a></li>
              <li><a id="c-phone"><small data-i18n="c.office"></small><span class="ltr" id="c-phone-v"></span></a></li>
              <li><a id="c-mail"><small data-i18n="c.email"></small><span id="c-mail-v"></span></a></li>
              <li><div><small data-i18n="c.address"></small><span id="c-addr-v"></span></div></li>
            </ul>
          </div>
          <div class="map"><iframe id="map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
        </div>
        <div class="card">
          <h2 class="serif" style="font-size:clamp(30px,3vw,40px);margin-bottom:22px" data-i18n="c.formTitle"></h2>
          <form id="quote-form" class="form" novalidate>
            <div class="field full"><label for="f-name" data-i18n="f.name"></label><input id="f-name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="f-phone" data-i18n="f.phone"></label>
              <div class="phone-row"><select id="f-dial" name="dial" aria-label="Country code"></select><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" required></div></div>
            <div class="field"><label for="f-email" data-i18n="f.email"></label><input id="f-email" name="email" type="email" autocomplete="email"></div>
            <div class="field"><label for="f-country" data-i18n="f.country"></label><select id="f-country" name="country" required></select></div>
            <div class="field"><label for="f-city" data-i18n="f.city"></label><input id="f-city" name="city" autocomplete="address-level2"></div>
            <div class="field"><label for="f-interest" data-i18n="f.interest"></label>
              <select id="f-interest" name="interest">
                <option value="buy" data-i18n="f.int.buy"></option><option value="source" data-i18n="f.int.source"></option>
                <option value="fleet" data-i18n="f.int.fleet"></option><option value="export" data-i18n="f.int.export"></option>
                <option value="parts" data-i18n="f.int.parts"></option>
              </select></div>
            <div class="field"><label for="f-vehicle" data-i18n="f.vehicle"></label><select id="f-vehicle" name="vehicle"><option value="" data-i18n="f.anyVehicle"></option></select></div>
            <div class="field full"><span class="label" data-i18n="f.contact"></span>
              <div class="radio-row" role="radiogroup">
                <label><input type="radio" name="contact" value="wa" checked><span data-i18n="f.c.wa"></span></label>
                <label><input type="radio" name="contact" value="call"><span data-i18n="f.c.call"></span></label>
                <label><input type="radio" name="contact" value="email"><span data-i18n="f.c.email"></span></label>
              </div></div>
            <div class="field full"><label for="f-message" data-i18n="f.message"></label><textarea id="f-message" name="message" rows="4" data-i18n-ph="f.messagePh"></textarea></div>
            <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">
              <button type="submit" class="btn btn-wa" style="flex:1" data-i18n="f.send"></button>
              <button type="button" id="f-email-btn" class="btn btn-light" style="flex:1" data-i18n="f.sendEmail"></button>
            </div>
            <p class="form-status full" id="f-status" role="status"></p>
            <p class="note full" style="margin:0" data-i18n="f.privacy"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/js/data.js?v=202610031542"></script>
  <script src="assets/js/i18n.js?v=202610031542"></script>
  <script src="assets/js/app.js?v=202610031542"></script>
</body>
</html>
