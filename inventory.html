<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ziventamotors.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Inventory · Ziventa Motors Dubai</title>
  <meta name="description" content="New and pre-owned vehicles in stock in Dubai, with delivery across the GCC.">
</head>
<body data-page="inventory">
  <main>
    <header class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.inventory"></span></nav>
        <h1 class="serif h1" data-i18n="inv.title"></h1>
        <p class="lead" data-i18n="inv.lead"></p>
      </div>
    </header>
    <section style="padding-bottom:40px">
      <div class="container">
        <div class="toolbar glass">
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" data-i18n-ph="inv.search" aria-label="Search"></label>
          <div class="select"><select id="make" aria-label="Make"><option value="" data-i18n="inv.allMakes"></option></select></div>
          <div class="select"><select id="cond" aria-label="Condition"><option value="" data-i18n="inv.allCond"></option><option value="new" data-i18n="car.new"></option><option value="used" data-i18n="car.used"></option></select></div>
          <div class="select"><select id="sort" aria-label="Sort"><option value="featured" data-i18n="inv.sort.featured"></option><option value="az" data-i18n="inv.sort.az"></option></select></div>
        </div>
        <div class="chips" id="types" role="group" aria-label="Body type"></div>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
