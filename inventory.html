<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Inventory · Ziventa Motors</title>
  <meta name="description" content="Browse new and used vehicles available for export from Dubai.">
</head>
<body data-page="inventory">
  <main>
    <header class="page-head">
      <div class="container">
        <nav class="crumbs reveal" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Inventory</span></nav>
        <span class="eyebrow reveal">Available for export</span>
        <h1 class="display reveal" data-delay="1">The <em>collection</em>.</h1>
        <p class="lead reveal" data-delay="2">Every vehicle inspected and ready to ship from Dubai. Can't find what you're after? We source to order.</p>
      </div>
    </header>
    <section style="padding-bottom:80px">
      <div class="container">
        <div class="toolbar glass">
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search make, model or year" aria-label="Search inventory"></label>
          <div class="select"><select id="make" aria-label="Make"><option value="">All makes</option></select></div>
          <div class="select"><select id="sort" aria-label="Sort"><option value="featured">Featured</option><option value="newest">Newest</option><option value="az">A – Z</option></select></div>
        </div>
        <div class="segmented" id="types" role="group" aria-label="Body type"></div>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
